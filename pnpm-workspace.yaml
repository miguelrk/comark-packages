packages:
  - 'packages/*'
  - 'packages/*/playground'
  - 'packages/*/docs'

catalog:
  typescript: ^5.7.0
  vitest: ^4.1.4
  tsdown: ^0.22.3
  tsx: ^4.22.4
  release-it: ^21.0.3
  '@types/node': ^22.10.0
  comark: ^0.9.0
  '@comark/nuxt': ^0.9.0
  '@comark/html': ^0.9.0
  '@comark/vue': ^0.9.0
  vue: ^3.5.43
  '@vue/test-utils': ^2.4.6
  nuxt: ^4.6.4
  rangi: ^2.2.0
  htmlparser2: ^12.0.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  vue-demi: true

tasks:
  build:
    dependsOn: ['^build']
    outputs: ['dist/**']
  generate:
    dependsOn: ['^build']
    outputs: ['.output/public/**']

pipelines:
  generate: [generate]

minimumReleaseAgeExclude:
  - '@comark/html@0.9.0'
  - '@comark/nuxt@0.9.0'
  - '@comark/vue@0.9.0'
  - comark@0.9.0
  - shiki@4.6.0
  - vite@8.3.6

overrides:
  shiki: 4.6.0
  vite: 8.3.6
